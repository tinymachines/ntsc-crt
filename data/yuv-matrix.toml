# The NTSC luminance / colour-difference matrix and its inverse.
#
# CONFIRMED AGAINST THE PRIMARY at M2 (2026-09-01): SMPTE ST 170M-2004,
# retrieved from SMPTE's own repository,
# https://pub.smpte.org/latest/st170/st170-20041130-pub.zip, zip sha256
# dc9a1f0487385b697de0caca0a8371d61d84bffe7352bcf707818cc9bd8df2bd.
# Clause 6.1 states the base matrix below digit for digit and calls the
# coefficients precise values (587/1000 etc.); clause 6.2's I/Q formulas
# (I = -0.2680(B-Y) + 0.7358(R-Y), Q = 0.4127(B-Y) + 0.4778(R-Y))
# re-derive from the reduction factors and the 33-degree rotation below
# to the printed four decimals. Originally transcribed at second hand
# from the nesdev wiki (the ITU BT.1700 republication was unreachable);
# that provenance is kept underneath for the record.

[provenance]
primary = "SMPTE ST 170M-2004, clauses 6.1, 6.2, 8, 10; pub.smpte.org zip sha256 dc9a1f0487385b697de0caca0a8371d61d84bffe7352bcf707818cc9bd8df2bd"
transcribed_from = "https://www.nesdev.org/wiki/NTSC_video"
revision_id = 23864
revision_timestamp = "2026-06-01T01:24:50Z"
transcription_date = "2026-09-01"
transcriber = "Claude (session 014VicWVt4rRCgaqFdzdEfcd), from the raw wikitext"
status = "confirmed against the primary, 2026-09-01 (M2)"

# Base matrix: rows are Y, B-Y, R-Y over [R, G, B].
[base]
y = [0.299, 0.587, 0.114]
b_minus_y = [-0.299, -0.587, 0.886]
r_minus_y = [0.701, -0.587, -0.114]

# Colour reduction factors: U = (B-Y) * u_factor, V = (R-Y) * v_factor.
[reduction]
u_factor = 0.492111
v_factor = 0.877283

# YUV to signal RGB, as the page states it. tests/data.rs re-derives each
# coefficient from [base] and [reduction] and holds them to 1e-4.
[inverse]
r_from_v = 1.139883
g_from_u = -0.394642
g_from_v = -0.580622
b_from_u = 2.032062

# I/Q is U/V rotated by 33 degrees; not the same as decoding YIQ with the
# proper different bandwidths per component.
[iq]
rotation_degrees = 33.0

# Demodulation constants: the factor of 2 from the integral of sin^2 over
# a cycle, and the burst peak-to-peak reference amplitude in IRE.
[saturation]
chroma_correction = 2.0
burst_reference_ire = 40.0
